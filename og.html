<!doctype html>
<!-- The link-preview card (og.png), drawn with the site's own styles. Render:
     chromium --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 --screenshot=og.png http://localhost:8000/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>JailbreakMe card</title>
<link rel="stylesheet" href="style.css">
<style>
  body { height: 630px; min-height: 0; background-position: 38% 42%; }
  .clock { font-size: 92px; }
  .date { font-size: 24px; }
  .card { flex: 1; display: flex; align-items: center; justify-content: center; gap: 44px; }
  .card img { width: 190px; height: 190px; border-radius: 34px; box-shadow: 0 6px 18px rgba(0,0,0,.6); }
  .alert { max-width: 470px; padding: 22px 22px 20px; font-size: 25px; line-height: 31px; }
  .alert h2 { font-size: 30px; line-height: 36px; margin-bottom: 8px; }
  .alert p { margin: 0 0 8px; }
  .alert .credit { font-size: 19px; line-height: 24px; margin: 0; }
  .lock-bottom { padding: 18px; }
  .slider-track { max-width: 460px; }
  .slider-label { animation: none; background-position: 60% 0; }
</style>
</head>
<body>
<header class="lock-top"><h1 class="clock">JailbreakMe</h1><p class="date">jailbreakme.dev</p></header>
<main class="card">
  <img src="apple-touch-icon.png" alt="">
  <div class="alert">
    <h2>Coming soon</h2>
    <p>Jailbreak iOS 27.0.1 from Safari.<br>One slide. No computer.</p>
    <p class="credit">Built on Calif's research · not affiliated</p>
  </div>
</main>
<footer class="lock-bottom">
  <div class="slider-track">
    <span class="slider-label">slide to jailbreak</span>
    <div class="slider-knob"><svg viewBox="0 0 40 30"><path d="M4 10.5h17V3l15 12-15 12v-7.5H4z"/></svg></div>
  </div>
</footer>
</body>
</html>
